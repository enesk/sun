name: Secret-Scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Zugangsschlüssel im Repository
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Versionierte Dateien scannen
        run: php scripts/secret-scan.php

      - name: .env.example gegen echte Werte prüfen
        run: php scripts/secret-scan.php .env.example
