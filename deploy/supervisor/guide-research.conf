; Recherche des Ratgebersystems (#13): Freshness-Probe und Tiefenrecherche
; mit Web-Search (FreshnessProbeJob, DeepResearchJob).
;
; Vier Worker, weil die Jobs fast ausschliesslich auf Antworten des
; Modell-Providers warten. Die tatsaechliche Parallelitaet je Tenant und
; gesamt begrenzt der Redis-Funnel (guide.concurrency), nicht die
; Worker-Zahl. Ein Job laeuft bis zu 15 Minuten (HandlesGuideRun::$timeout),
; der Worker-Timeout liegt darueber. --tries=1 greift nicht: die Jobs
; begrenzen sich ueber retryUntil() und werden bei Budget, 429 und
; Parallelitaetsgrenze mit release() zurueckgestellt.
;
; Diese Dateien (guide-*.conf) definieren die Worker fuer Server, die die
; Queues ohne Horizon fahren. Laeuft Horizon (Standard dieses Projekts),
; stehen dieselben Worker-Zahlen in config/horizon.php unter
; 'supervisor-guide-*' — dann darf dieses Programm NICHT zusaetzlich laufen,
; sonst zieht jede Queue zwei Konsumenten.
;
; Ablage: /etc/supervisor/conf.d/guide-research.conf

[program:guide-research]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=guide-research --sleep=3 --tries=1 --max-time=3600 --timeout=960
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=4
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/guide-research.log
stopwaitsecs=970
