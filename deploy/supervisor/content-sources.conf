; Quell-Connectoren der Content-Pipeline (#7, #22).
;
; Diese Datei ist die Definition der Worker fuer Server, die die Queues ohne
; Horizon fahren. Laeuft Horizon (Standard dieses Projekts), stehen dieselben
; Worker-Zahlen in config/horizon.php unter 'supervisor-content-*' — dann
; darf dieses Programm NICHT zusaetzlich laufen, sonst zieht jede Queue zwei
; Konsumenten.
;
; Ablage: /etc/supervisor/conf.d/content-sources.conf
; Platzhalter {{deploy_path}} und {{user}} setzt `dep deploy:supervisor-content`.

[program:content-sources]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=content-sources --sleep=3 --tries=1 --max-time=3600 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=2
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/content-sources.log
stopwaitsecs=310
