; Veroeffentlichung und Metriken der Content-Pipeline (#21, #22, #23).
;
; Bewusst ein einzelner Worker: die Artikel eines Portals erscheinen
; gestaffelt, und die Reihenfolge der Zeitpunkte soll erhalten bleiben.
;
; Hinweis zu Horizon siehe content-sources.conf.
;
; Ablage: /etc/supervisor/conf.d/content-publish.conf

[program:content-publish]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=content-publish,content-metrics --sleep=3 --tries=1 --max-time=3600 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=1
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/content-publish.log
stopwaitsecs=310
