; Erzeugung der Content-Pipeline (#14, #15, #16, #22): Themenfindung,
; Texterstellung, Qualitaetsgate, Assets.
;
; Vier Worker, weil die Jobs fast ausschliesslich auf Antworten des
; Modell-Providers warten; CPU ist hier nicht der Engpass. Ein Job laeuft bis
; zu 30 Minuten (GenerateDraftJob::$timeout), der Worker-Timeout liegt
; darueber.
;
; Hinweis zu Horizon siehe content-sources.conf.
;
; Ablage: /etc/supervisor/conf.d/content-generate.conf

[program:content-generate]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=content-discovery,content-llm,content-assets --sleep=3 --tries=1 --max-time=3600 --timeout=1800
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=4
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/content-generate.log
stopwaitsecs=1810
