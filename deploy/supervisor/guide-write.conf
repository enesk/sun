; Schreiben des Ratgebersystems (#13): Artikel schreiben, Abschnitte
; aktualisieren, Nachbesserung und Qualitaetsgate (WriteArticleJob,
; UpdateSectionsJob, FixSectionsJob, QualityCheckJob, ProposeOutlineJob).
;
; Vier Worker, Begrenzung der Parallelitaet ueber den Redis-Funnel
; (guide.concurrency). Timeout wie guide-research.conf.
;
; Dazu nachrangig guide-assets (Titelbild je Thema, GenerateTopicImageJob,
; #20): ein Worker nimmt Bildjobs erst, wenn guide-write leer ist. Nicht an
; guide-publish, weil dessen einziger Worker sonst bis zu 600 s pro Bild fuer
; Veroeffentlichung und Tagesauswahl blockiert waere (#36/#38). Timeout 960
; bleibt, er deckt den Bildjob mit ab. Gleiche Queues wie
; supervisor-guide-write in config/horizon.php.
;
; Hinweis zu Horizon siehe guide-research.conf.
;
; Ablage: /etc/supervisor/conf.d/guide-write.conf

[program:guide-write]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=guide-write,guide-assets --sleep=3 --tries=1 --max-time=3600 --timeout=960
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=4
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/guide-write.log
stopwaitsecs=970
