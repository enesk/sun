; Veroeffentlichung und Tagesauswahl des Ratgebersystems (#13):
; PublishArticleJob (guide-publish) und DispatchDueTopicsJob (guide-dispatch),
; seit dem Rueckbau der alten Pipeline (#23) auch der Metrik-Collector
; (CollectArticleMetricsJob, content-metrics; ersetzt content-publish.conf).
;
; Bewusst ein einzelner Worker: Veroeffentlichungen schreiben Sitemap,
; Cache und IndexNow und sollen der Reihe nach laufen; die Tagesauswahl
; laeuft einmal je Tenant und Tag und braucht keinen eigenen Prozess.
; guide-publish hat Vorrang.
;
; Hinweis zu Horizon siehe guide-research.conf.
;
; Ablage: /etc/supervisor/conf.d/guide-publish.conf

[program:guide-publish]
process_name=%(program_name)s_%(process_num)02d
command=php {{deploy_path}}/current/artisan queue:work redis --queue=guide-publish,guide-dispatch,content-metrics --sleep=3 --tries=1 --max-time=3600 --timeout=960
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=1
redirect_stderr=true
stdout_logfile={{deploy_path}}/log/guide-publish.log
stopwaitsecs=970
